name: Io Strict CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - release/**
    paths:
      - ".github/workflows/io-strict-ci.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "test/**"
      - "README.md"
      - "CHANGELOG.md"
      - "vix.json"

  pull_request:
    branches:
      - main
      - master
      - dev
      - release/**
    paths:
      - ".github/workflows/io-strict-ci.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "test/**"
      - "README.md"
      - "CHANGELOG.md"
      - "vix.json"

  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_JOBS: 2
  VIX_GIT_BRANCH: dev

jobs:
  build-test-sanitized:
    name: Sanitized Build and Tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Checkout io repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            clang \
            g++ \
            cppcheck \
            clang-tidy \
            valgrind \
            pkg-config \
            git \
            curl \
            ca-certificates

      - name: Fetch sibling dependency
        run: |
          set -euxo pipefail

          rm -rf ../error
          git clone --depth 1 --branch "${VIX_GIT_BRANCH}" https://github.com/vixcpp/error.git ../error

      - name: Verify required sibling dependency
        run: |
          set -euxo pipefail

          test -f ../error/CMakeLists.txt
          test -f ../error/include/vix/error/Result.hpp

      - name: Export dependency include paths
        run: |
          EXTRA_PATHS="$GITHUB_WORKSPACE/../error/include"

          echo "CPATH=$EXTRA_PATHS${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$EXTRA_PATHS${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}" >> "$GITHUB_ENV"

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVIX_IO_BUILD_TESTS=ON \
            -DVIX_ENABLE_SANITIZERS=ON \
            -DVIX_IO_FETCH_ERROR=OFF

      - name: Build
        run: |
          cmake --build build-sanitize -j"${BUILD_JOBS}"

      - name: Print executables
        run: |
          find build-sanitize -type f -executable | sort || true

      - name: Run ctest
        run: |
          cd build-sanitize
          ctest --output-on-failure --timeout 90

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout io repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            clang \
            g++ \
            cppcheck \
            clang-tidy \
            pkg-config \
            git \
            curl \
            ca-certificates

      - name: Fetch sibling dependency
        run: |
          set -euxo pipefail

          rm -rf ../error
          git clone --depth 1 --branch "${VIX_GIT_BRANCH}" https://github.com/vixcpp/error.git ../error

      - name: Verify required sibling dependency
        run: |
          set -euxo pipefail

          test -f ../error/CMakeLists.txt
          test -f ../error/include/vix/error/Result.hpp

      - name: Export dependency include paths
        run: |
          EXTRA_PATHS="$GITHUB_WORKSPACE/../error/include"

          echo "CPATH=$EXTRA_PATHS${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$EXTRA_PATHS${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}" >> "$GITHUB_ENV"

      - name: Configure for analysis
        run: |
          cmake -S . -B build-analyze -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVIX_IO_BUILD_TESTS=ON \
            -DVIX_ENABLE_SANITIZERS=OFF \
            -DVIX_IO_FETCH_ERROR=OFF

      - name: Run clang-tidy
        run: |
          set +e
          find src test -name '*.cpp' -print0 | xargs -0 -r -n1 -P2 clang-tidy -p build-analyze
          exit 0

      - name: Run cppcheck
        run: |
          set +e
          cppcheck \
            --enable=all \
            --std=c++20 \
            --inconclusive \
            --quiet \
            --suppress=missingIncludeSystem \
            include/ src/ test/
          exit 0

  valgrind:
    name: Valgrind Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout io repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            valgrind \
            pkg-config \
            git \
            curl \
            ca-certificates

      - name: Fetch sibling dependency
        run: |
          set -euxo pipefail

          rm -rf ../error
          git clone --depth 1 --branch "${VIX_GIT_BRANCH}" https://github.com/vixcpp/error.git ../error

      - name: Verify required sibling dependency
        run: |
          set -euxo pipefail

          test -f ../error/CMakeLists.txt
          test -f ../error/include/vix/error/Result.hpp

      - name: Export dependency include paths
        run: |
          EXTRA_PATHS="$GITHUB_WORKSPACE/../error/include"

          echo "CPATH=$EXTRA_PATHS${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$EXTRA_PATHS${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}" >> "$GITHUB_ENV"

      - name: Configure valgrind build
        run: |
          cmake -S . -B build-valgrind -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVIX_IO_BUILD_TESTS=ON \
            -DVIX_ENABLE_SANITIZERS=OFF \
            -DVIX_IO_FETCH_ERROR=OFF

      - name: Build
        run: |
          cmake --build build-valgrind -j"${BUILD_JOBS}"

      - name: Run valgrind on test executables
        shell: bash
        run: |
          set +e

          mapfile -t TEST_BINS < <(
            find build-valgrind/test -type f -executable 2>/dev/null | sort
          )

          if [ ${#TEST_BINS[@]} -eq 0 ]; then
            echo "No test executables found for valgrind."
            exit 0
          fi

          for exe in "${TEST_BINS[@]}"; do
            echo "==> Valgrind: $exe"
            timeout 20s valgrind \
              --leak-check=full \
              --show-leak-kinds=all \
              --track-origins=yes \
              "$exe"

            STATUS=$?
            if [ $STATUS -ne 0 ] && [ $STATUS -ne 124 ]; then
              echo "::warning::Valgrind reported issues for $exe"
            fi
          done

          exit 0

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout io repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            git \
            curl \
            ca-certificates

      - name: Fetch sibling dependency
        run: |
          set -euxo pipefail

          rm -rf ../error
          git clone --depth 1 --branch "${VIX_GIT_BRANCH}" https://github.com/vixcpp/error.git ../error

      - name: Verify required sibling dependency
        run: |
          set -euxo pipefail

          test -f ../error/CMakeLists.txt
          test -f ../error/include/vix/error/Result.hpp

      - name: Build and install error
        run: |
          cmake -S ../error -B ../error/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIX_ERROR_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

          cmake --build ../error/build -j"${BUILD_JOBS}"
          cmake --install ../error/build

      - name: Build and install io
        run: |
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIX_IO_BUILD_TESTS=OFF \
            -DVIX_IO_FETCH_ERROR=OFF \
            -DCMAKE_PREFIX_PATH="$PWD/stage" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

          cmake --build build-install -j"${BUILD_JOBS}"
          cmake --install build-install

      - name: Verify install tree
        run: |
          find stage -maxdepth 8 -type f | sort

          test -f stage/include/vix/io/IoResult.hpp
          test -f stage/include/vix/error/Result.hpp
          test -f stage/lib/libvix_io.a
          test -f stage/lib/cmake/vix_io/vix_ioTargets.cmake

      - name: Verify installed package with find_package
        run: |
          mkdir -p smoke

          cat > smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(io_smoke LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          find_package(vix_io CONFIG REQUIRED)

          add_executable(io_smoke main.cpp)
          target_link_libraries(io_smoke PRIVATE vix::io)
          EOF

          cat > smoke/main.cpp <<'EOF'
          #include <vix/io/IoResult.hpp>

          #include <iostream>

          int main()
          {
            std::cout << "vix::io package found\n";
            return 0;
          }
          EOF

          cmake -S smoke -B smoke/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/stage"

          cmake --build smoke/build -j"${BUILD_JOBS}"

  config-coverage:
    name: Configuration Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout io repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            git \
            curl \
            ca-certificates

      - name: Fetch sibling dependency
        run: |
          set -euxo pipefail

          rm -rf ../error
          git clone --depth 1 --branch "${VIX_GIT_BRANCH}" https://github.com/vixcpp/error.git ../error

      - name: Verify required sibling dependency
        run: |
          set -euxo pipefail

          test -f ../error/CMakeLists.txt
          test -f ../error/include/vix/error/Result.hpp

      - name: Export dependency include paths
        run: |
          EXTRA_PATHS="$GITHUB_WORKSPACE/../error/include"

          echo "CPATH=$EXTRA_PATHS${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$EXTRA_PATHS${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}" >> "$GITHUB_ENV"

      - name: Configure release mode
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIX_IO_BUILD_TESTS=OFF \
            -DVIX_ENABLE_SANITIZERS=OFF \
            -DVIX_IO_FETCH_ERROR=OFF

      - name: Build release mode
        run: |
          cmake --build build-release -j"${BUILD_JOBS}"

      - name: Configure debug mode
        run: |
          cmake -S . -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVIX_IO_BUILD_TESTS=OFF \
            -DVIX_ENABLE_SANITIZERS=OFF \
            -DVIX_IO_FETCH_ERROR=OFF

      - name: Build debug mode
        run: |
          cmake --build build-debug -j"${BUILD_JOBS}"

  summary:
    name: Io Strict CI Summary
    needs:
      - build-test-sanitized
      - static-analysis
      - valgrind
      - package-smoke
      - config-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Print summary
        run: |
          echo "Io strict CI completed."
          echo "- gcc and clang sanitized builds"
          echo "- io unit tests"
          echo "- static analysis"
          echo "- valgrind smoke checks"
          echo "- install and find_package smoke test"
          echo "- release and debug configuration coverage"
